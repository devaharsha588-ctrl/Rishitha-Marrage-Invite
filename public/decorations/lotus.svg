<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Stylized temple ceiling lotus — multi-layered geometric petals -->
  <g transform="translate(40,40)" stroke="currentColor" fill="currentColor">
    <!-- Outer petals (8) -->
    <g opacity="0.3">
      <path d="M0,-34 C6,-28 8,-18 0,-10 C-8,-18 -6,-28 0,-34Z"/>
      <path d="M0,-34 C6,-28 8,-18 0,-10 C-8,-18 -6,-28 0,-34Z" transform="rotate(45)"/>
      <path d="M0,-34 C6,-28 8,-18 0,-10 C-8,-18 -6,-28 0,-34Z" transform="rotate(90)"/>
      <path d="M0,-34 C6,-28 8,-18 0,-10 C-8,-18 -6,-28 0,-34Z" transform="rotate(135)"/>
      <path d="M0,-34 C6,-28 8,-18 0,-10 C-8,-18 -6,-28 0,-34Z" transform="rotate(180)"/>
      <path d="M0,-34 C6,-28 8,-18 0,-10 C-8,-18 -6,-28 0,-34Z" transform="rotate(225)"/>
      <path d="M0,-34 C6,-28 8,-18 0,-10 C-8,-18 -6,-28 0,-34Z" transform="rotate(270)"/>
      <path d="M0,-34 C6,-28 8,-18 0,-10 C-8,-18 -6,-28 0,-34Z" transform="rotate(315)"/>
    </g>
    <!-- Inner petals (8, rotated 22.5°) -->
    <g opacity="0.5">
      <path d="M0,-24 C4,-20 5,-13 0,-7 C-5,-13 -4,-20 0,-24Z" transform="rotate(22.5)"/>
      <path d="M0,-24 C4,-20 5,-13 0,-7 C-5,-13 -4,-20 0,-24Z" transform="rotate(67.5)"/>
      <path d="M0,-24 C4,-20 5,-13 0,-7 C-5,-13 -4,-20 0,-24Z" transform="rotate(112.5)"/>
      <path d="M0,-24 C4,-20 5,-13 0,-7 C-5,-13 -4,-20 0,-24Z" transform="rotate(157.5)"/>
      <path d="M0,-24 C4,-20 5,-13 0,-7 C-5,-13 -4,-20 0,-24Z" transform="rotate(202.5)"/>
      <path d="M0,-24 C4,-20 5,-13 0,-7 C-5,-13 -4,-20 0,-24Z" transform="rotate(247.5)"/>
      <path d="M0,-24 C4,-20 5,-13 0,-7 C-5,-13 -4,-20 0,-24Z" transform="rotate(292.5)"/>
      <path d="M0,-24 C4,-20 5,-13 0,-7 C-5,-13 -4,-20 0,-24Z" transform="rotate(337.5)"/>
    </g>
    <!-- Center circle -->
    <circle r="6" opacity="0.6"/>
    <circle r="3.5" fill="none" stroke-width="0.5" opacity="0.4"/>
  </g>
</svg>
