<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <!-- Ornamental frame with temple-inspired corner flourishes -->
  <g stroke="currentColor" fill="currentColor">
    <!-- Main frame rectangle -->
    <rect x="20" y="20" width="360" height="460" rx="1" stroke-width="0.8" opacity="0.3" fill="none"/>
    <rect x="26" y="26" width="348" height="448" rx="1" stroke-width="0.4" opacity="0.15" fill="none"/>

    <!-- Top-left corner flourish -->
    <g opacity="0.5">
      <path d="M20,55 Q10,45 10,30 Q10,15 20,10 Q25,20 20,30 Q18,40 20,55" stroke-width="0.6" fill="none"/>
      <path d="M55,20 Q45,10 30,10 Q15,10 10,20 Q20,25 30,20 Q40,18 55,20" stroke-width="0.6" fill="none"/>
      <circle cx="14" cy="14" r="2.5" opacity="0.4"/>
      <circle cx="14" cy="14" r="1" opacity="0.6"/>
      <path d="M8,8 L14,14" stroke-width="0.4" opacity="0.3"/>
    </g>

    <!-- Top-right corner flourish -->
    <g opacity="0.5" transform="translate(400,0) scale(-1,1)">
      <path d="M20,55 Q10,45 10,30 Q10,15 20,10 Q25,20 20,30 Q18,40 20,55" stroke-width="0.6" fill="none"/>
      <path d="M55,20 Q45,10 30,10 Q15,10 10,20 Q20,25 30,20 Q40,18 55,20" stroke-width="0.6" fill="none"/>
      <circle cx="14" cy="14" r="2.5" opacity="0.4"/>
      <circle cx="14" cy="14" r="1" opacity="0.6"/>
      <path d="M8,8 L14,14" stroke-width="0.4" opacity="0.3"/>
    </g>

    <!-- Bottom-left corner flourish -->
    <g opacity="0.5" transform="translate(0,500) scale(1,-1)">
      <path d="M20,55 Q10,45 10,30 Q10,15 20,10 Q25,20 20,30 Q18,40 20,55" stroke-width="0.6" fill="none"/>
      <path d="M55,20 Q45,10 30,10 Q15,10 10,20 Q20,25 30,20 Q40,18 55,20" stroke-width="0.6" fill="none"/>
      <circle cx="14" cy="14" r="2.5" opacity="0.4"/>
      <circle cx="14" cy="14" r="1" opacity="0.6"/>
      <path d="M8,8 L14,14" stroke-width="0.4" opacity="0.3"/>
    </g>

    <!-- Bottom-right corner flourish -->
    <g opacity="0.5" transform="translate(400,500) scale(-1,-1)">
      <path d="M20,55 Q10,45 10,30 Q10,15 20,10 Q25,20 20,30 Q18,40 20,55" stroke-width="0.6" fill="none"/>
      <path d="M55,20 Q45,10 30,10 Q15,10 10,20 Q20,25 30,20 Q40,18 55,20" stroke-width="0.6" fill="none"/>
      <circle cx="14" cy="14" r="2.5" opacity="0.4"/>
      <circle cx="14" cy="14" r="1" opacity="0.6"/>
      <path d="M8,8 L14,14" stroke-width="0.4" opacity="0.3"/>
    </g>

    <!-- Top center ornament -->
    <g opacity="0.35">
      <path d="M190,20 Q195,12 200,10 Q205,12 210,20" stroke-width="0.6" fill="none"/>
      <circle cx="200" cy="10" r="2" opacity="0.5"/>
    </g>

    <!-- Bottom center ornament -->
    <g opacity="0.35">
      <path d="M190,480 Q195,488 200,490 Q205,488 210,480" stroke-width="0.6" fill="none"/>
      <circle cx="200" cy="490" r="2" opacity="0.5"/>
    </g>

    <!-- Side midpoint accents -->
    <line x1="14" y1="245" x2="20" y2="245" stroke-width="0.5" opacity="0.2"/>
    <line x1="14" y1="255" x2="20" y2="255" stroke-width="0.5" opacity="0.2"/>
    <circle cx="12" cy="250" r="1.5" opacity="0.25"/>
    
    <line x1="380" y1="245" x2="386" y2="245" stroke-width="0.5" opacity="0.2"/>
    <line x1="380" y1="255" x2="386" y2="255" stroke-width="0.5" opacity="0.2"/>
    <circle cx="388" cy="250" r="1.5" opacity="0.25"/>
  </g>
</svg>
